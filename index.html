<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Kapil Jadhav | Premium Portfolio</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

<!-- Icons -->
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<style>
/* ── BASE & RESET ── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: #030305; 
  color: #e8e8f0;
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Optimize touch response on mobile (removes tap delay) */
a, button, input, textarea, .nav-toggle {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* ── VARIABLES ── */
:root {
  --accent: #8b5cf6;
  --accent-light: #a78bfa;
  --accent-dark: #6d28d9;
  --accent-glow: rgba(139, 92, 246, 0.4);
  --surface: rgba(20, 20, 25, 0.6);
  --border: rgba(139, 92, 246, 0.2);
  --text: #ffffff;
  --text-muted: #a1a1aa;
}

/* ── CUSTOM CURSOR (Only applied on non-touch devices) ── */
@media (pointer: fine) {
  body { cursor: none; }
}
.cursor-dot, .cursor-outline {
  position: fixed; top: 0; left: 0; pointer-events: none; z-index: 99999;
  transform: translate(-50%, -50%); will-change: transform;
}
.cursor-dot {
  width: 8px; height: 8px; background: var(--accent-light); border-radius: 50%;
  box-shadow: 0 0 10px var(--accent); transition: width 0.2s, height 0.2s, background 0.2s;
}
.cursor-outline {
  width: 40px; height: 40px; border: 1px solid var(--accent-glow); border-radius: 50%;
  z-index: 99998; transition: width 0.2s, height 0.2s, background 0.2s;
}
.hover-active .cursor-dot { width: 12px; height: 12px; background: #fff; }
.hover-active .cursor-outline { width: 60px; height: 60px; background: rgba(255,255,255,0.05); border-color: transparent; }

/* ── PRELOADER ── */
#preloader {
  position: fixed; inset: 0; background: #030305; z-index: 100000;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s;
}
#preloader.preloader-hide { transform: translateY(-100%); opacity: 0; pointer-events: none; visibility: hidden; }

.loader-wrapper { position: relative; width: 140px; height: 140px; display: flex; justify-content: center; align-items: center; }
.loader-circle {
  position: absolute; inset: 0; border-radius: 50%;
  border: 2px solid rgba(0, 243, 255, 0.05); border-top-color: #00f3ff;
  animation: spinLoader 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
}
.loader-circle::after {
  content: ''; position: absolute; inset: -15px; border-radius: 50%;
  border: 2px solid rgba(139, 92, 246, 0.05); border-bottom-color: var(--accent-light);
  animation: spinLoader 1.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite reverse;
}
.loader-counter { font-family: 'Inter', sans-serif; font-size: 2rem; font-weight: 700; color: var(--text); }
.loader-percent { font-size: 1.2rem; color: #00f3ff; margin-left: 2px; }
.loader-text-bot {
  margin-top: 40px; font-size: 0.75rem; letter-spacing: 6px; color: var(--accent-light);
  text-transform: uppercase; animation: pulseTxt 1s infinite alternate;
}
@keyframes spinLoader { 100% { transform: rotate(360deg); } }
@keyframes pulseTxt { 0% { opacity: 0.4; } 100% { opacity: 1; text-shadow: 0 0 10px var(--accent-glow); } }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #030305; }
::-webkit-scrollbar-thumb { background: var(--accent-dark); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9000;
  display: flex; justify-content: space-between; align-items: center;
  padding: 30px 5%; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: padding, background;
}
nav.stuck {
  padding: 15px 5%; background: rgba(3, 3, 5, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.nav-brand {
  font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700;
  color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 12px;
}
.nav-brand img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; object-position: top; border: 2px solid #00f3ff; }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-name { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; color: var(--text); }
.brand-role { font-family: 'Inter', sans-serif; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: #00f3ff; margin-top: 4px; }
.nav-menu { display: flex; gap: 30px; list-style: none; }
.nav-menu a {
  font-size: 0.85rem; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; 
  color: var(--text-muted); text-decoration: none; transition: color 0.3s; position: relative; padding: 5px 0;
}
.nav-menu a::after {
  content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px;
  background: var(--accent-light); transition: width 0.3s ease; border-radius: 2px;
}
.nav-menu a:hover { color: var(--text); }
.nav-menu a:hover::after { width: 100%; }

.nav-toggle { display: none; flex-direction: column; gap: 6px; cursor: pointer; z-index: 9001; position: relative; }
.nav-toggle span { display: block; width: 30px; height: 2px; background: var(--text); transition: 0.4s; }
.nav-toggle.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); background: var(--accent-light); }
.nav-toggle.active span:nth-child(2) { opacity: 0; }
.nav-toggle.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); background: var(--accent-light); }

/* ── HERO ── */
#hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 140px 5% 100px; position: relative; overflow: hidden; }

/* GPU Optimized Aurora Background */
.aurora-bg { position: absolute; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; background: #030305; }
.aurora-blob { 
  position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; mix-blend-mode: screen; 
  animation: floatAurora 25s infinite alternate ease-in-out;
  will-change: transform; transform: translateZ(0);
}
.orb-1 { width: 60vw; height: 60vw; background: rgba(139, 92, 246, 0.3); top: -20%; left: -10%; }
.orb-2 { width: 50vw; height: 50vw; background: rgba(0, 243, 255, 0.2); bottom: -10%; right: -10%; animation-delay: -7s; }
.orb-3 { width: 40vw; height: 40vw; background: rgba(109, 40, 217, 0.3); top: 30%; left: 40%; animation-delay: -14s; }
@keyframes floatAurora { 0% { transform: translate3d(0, 0, 0) scale(1); } 100% { transform: translate3d(8vw, 12vh, 0) scale(1.1); } }

.grid-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 1; background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.5px, transparent 1.5px); background-size: 35px 35px; mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%); -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%); }

#hero-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: 0.8; }

.floating-element {
  position: absolute; z-index: 1; opacity: 0.15; color: var(--accent-light); font-size: 2rem; pointer-events: none; filter: blur(1px);
  animation: floatRandom 15s ease-in-out infinite alternate; will-change: transform;
}
.f1 { top: 20%; left: 15%; animation-delay: 0s; font-size: 3rem; }
.f2 { top: 60%; right: 10%; animation-delay: -2s; font-size: 2.5rem; color: #00f3ff; }
.f3 { bottom: 15%; left: 25%; animation-delay: -4s; font-size: 4rem; opacity: 0.1;}
@keyframes floatRandom { 0% { transform: translate3d(0, 0, 0) rotate(0deg); } 100% { transform: translate3d(30px, -40px, 0) rotate(20deg); } }

.hero-content { position: relative; z-index: 10; max-width: 900px; text-align: center; display: flex; flex-direction: column; align-items: center; }

.hero-avatar-wrapper {
  position: relative; width: 170px; height: 170px; margin-bottom: 20px; border-radius: 50%; padding: 5px;
  background: linear-gradient(135deg, var(--accent), #00f3ff); box-shadow: 0 10px 30px var(--accent-glow);
}
.hero-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: top; border: 4px solid #030305; }

.hero-badge {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px; border: 1px solid var(--border);
  background: rgba(139, 92, 246, 0.1); border-radius: 100px; font-size: 0.8rem; font-weight: 600; letter-spacing: 1px;
  color: #00f3ff; margin-bottom: 30px; backdrop-filter: blur(10px); animation: slideDown 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.hero-badge i { color: #10b981; animation: pulse 2s infinite; }

.hero-name { font-family: 'Playfair Display', serif; font-size: clamp(3.5rem, 8vw, 6.5rem); font-weight: 700; line-height: 1.1; color: var(--text); margin-bottom: 20px; }
.hero-name .gradient-text { background: linear-gradient(to right, #00f3ff, var(--accent), #d8b4fe, #00f3ff); background-size: 200% auto; color: transparent; -webkit-background-clip: text; background-clip: text; animation: shine 5s linear infinite; }
@keyframes shine { to { background-position: 200% center; } }

.hero-typewriter { font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 300; color: var(--text-muted); height: 40px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.type-cursor { display: inline-block; width: 3px; height: 1.2em; background: var(--accent); animation: blink 0.8s infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

.hero-desc { font-size: 1.1rem; line-height: 1.8; color: var(--text-muted); max-width: 600px; margin: 30px 0 40px; }

.hero-actions { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; position: relative; z-index: 20; }
.btn { padding: 16px 32px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; letter-spacing: 1px; text-decoration: none; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 10px; position: relative; overflow: hidden; pointer-events: auto; }
.btn-primary { background: var(--accent-dark); color: #fff; border: 1px solid var(--accent); box-shadow: 0 10px 30px -10px var(--accent-glow); }
.btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 40px -10px var(--accent); background: var(--accent); }
.btn-outline { background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(10px); }
.btn-outline:hover { background: rgba(255,255,255,0.05); border-color: #00f3ff; transform: translateY(-3px); }
.btn-resume { background: rgba(0, 243, 255, 0.1); color: #00f3ff; border: 1px solid rgba(0, 243, 255, 0.3); backdrop-filter: blur(10px); }
.btn-resume:hover { background: rgba(0, 243, 255, 0.2); border-color: #00f3ff; color: #fff; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 243, 255, 0.2); }

.scroll-indicator { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0.6; animation: float 3s ease-in-out infinite; z-index: 2; pointer-events: none; }
.mouse { width: 26px; height: 40px; border: 2px solid var(--text-muted); border-radius: 20px; position: relative; }
.mouse::before { content: ''; width: 4px; height: 6px; background: var(--accent-light); position: absolute; top: 8px; left: 50%; transform: translateX(-50%); border-radius: 2px; animation: scrollWheel 2s infinite; }
@media (max-height: 750px) { .scroll-indicator { display: none; } }

/* ── LAYOUT & TYPOGRAPHY ── */
section { padding: 120px 5%; position: relative; }
.container { max-width: 1200px; margin: 0 auto; }
.section-head { margin-bottom: 60px; text-align: center; }
.section-tag { font-size: 0.8rem; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--accent-light); margin-bottom: 16px; display: inline-flex; align-items: center; gap: 12px; }
.section-tag::before, .section-tag::after { content: ''; width: 30px; height: 1px; background: var(--accent); }
.section-title { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 700; color: var(--text); }
.section-title span { font-style: italic; color: #00f3ff; }

.glass { background: var(--surface); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }

/* ── ABOUT ── */
#about { background: radial-gradient(circle at right, rgba(139,92,246,0.05), transparent 50%); }
.about-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 80px; align-items: center; }
.about-image-wrapper { position: relative; border-radius: 24px; }
.about-image { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 24px; filter: grayscale(20%) contrast(110%); transition: 0.5s; border: 1px solid var(--border); }
.about-image-wrapper:hover .about-image { filter: grayscale(0%) contrast(100%); transform: scale(1.02); border-color: #00f3ff;}
.about-floating-card { position: absolute; bottom: -30px; right: -30px; padding: 24px; border-radius: 16px; animation: float 4s ease-in-out infinite; z-index: 2; border: 1px solid var(--accent); }
.about-floating-card .stat { font-family: 'Playfair Display', serif; font-size: 2.5rem; font-weight: 700; color: #00f3ff; line-height: 1; }
.about-floating-card .label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; display: block;}
.about-text h3 { font-size: 2rem; margin-bottom: 24px; font-weight: 500; }
.about-text p { font-size: 1.1rem; line-height: 1.8; color: var(--text-muted); margin-bottom: 20px; }
.about-text strong { color: var(--text); }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 40px; }
.info-item { display: flex; flex-direction: column; gap: 5px; }
.info-item .key { font-size: 0.8rem; color: var(--accent-light); text-transform: uppercase; letter-spacing: 1px; }
.info-item .val { font-size: 1.1rem; font-weight: 500; color: var(--text); }

/* ── SKILLS ── */
#skills { position: relative; }
.skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; perspective: 1000px; }
.skill-card { padding: 32px; border-radius: 16px; transition: border-color 0.4s; transform-style: preserve-3d; will-change: transform; }
.skill-card:hover { border-color: #00f3ff; box-shadow: 0 10px 30px rgba(0,243,255,0.1); }
.skill-icon { width: 50px; height: 50px; background: rgba(139,92,246,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: var(--accent-light); margin-bottom: 24px; transform: translateZ(30px); }
.skill-card h4 { font-size: 1.3rem; margin-bottom: 10px; transform: translateZ(20px); }
.skill-card p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; transform: translateZ(15px); }
.progress-bg { height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; transform: translateZ(10px); }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent-dark), #00f3ff); width: 0; transition: width 1.5s cubic-bezier(0.16, 1, 0.3, 1); border-radius: 10px; }

/* ── PROJECTS ── */
#projects { background: radial-gradient(circle at left, rgba(0,243,255,0.05), transparent 50%); }
.projects-grid { display: flex; flex-direction: column; gap: 40px; }
.project-card { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-radius: 24px; overflow: hidden; background: var(--surface); border: 1px solid rgba(255,255,255,0.05); transition: 0.4s; }
.project-card:nth-child(even) { grid-template-columns: 1fr 1fr; direction: rtl; }
.project-card:nth-child(even) > * { direction: ltr; }
.project-card:hover { border-color: var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: translateY(-5px); }
.project-img-wrapper { position: relative; overflow: hidden; height: 100%; min-height: 350px; }
.project-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), filter 0.8s; }
.project-card:hover .project-img { transform: scale(1.05); filter: brightness(0.8); }
.project-img-overlay { position: absolute; inset: 0; background: linear-gradient(to right, #030305, transparent); }
.project-card:nth-child(even) .project-img-overlay { background: linear-gradient(to left, #030305, transparent); }
.project-info { padding: 60px; display: flex; flex-direction: column; justify-content: center; }
.project-index { font-family: 'Playfair Display', serif; font-size: 3rem; font-weight: 700; color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,0.1); margin-bottom: 20px; transition: 0.4s; }
.project-card:hover .project-index { -webkit-text-stroke: 1px #00f3ff; color: rgba(0,243,255,0.05); }
.project-title { font-size: 2rem; margin-bottom: 16px; font-family: 'Playfair Display', serif; }
.project-desc { color: var(--text-muted); line-height: 1.7; margin-bottom: 30px; font-size: 1.05rem; }
.tags { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; }
.tag { font-size: 0.75rem; font-weight: 600; letter-spacing: 1px; padding: 6px 16px; border-radius: 100px; background: rgba(139,92,246,0.1); color: var(--accent-light); border: 1px solid rgba(139,92,246,0.2); }
.project-links { display: flex; gap: 20px; }
.project-link { display: inline-flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; font-weight: 500; font-size: 0.9rem; transition: 0.3s; padding: 8px 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(255,255,255,0.02); }
.project-link i { font-size: 1.2rem; }
.project-link:hover { background: rgba(0,243,255,0.1); border-color: #00f3ff; color: #00f3ff; transform: translateY(-2px); }

/* ── TIMELINE (JOURNEY) ── */
#journey { background: #050508; position: relative; }
.timeline { position: relative; max-width: 800px; margin: 0 auto; padding: 20px 0; }
.timeline::before { content: ''; position: absolute; top: 0; left: 24px; height: 100%; width: 2px; background: linear-gradient(to bottom, transparent, var(--accent), #00f3ff, transparent); }
.timeline-item { position: relative; padding-left: 70px; margin-bottom: 40px; }
.timeline-item:last-child { margin-bottom: 0; }
.timeline-dot { position: absolute; left: 16px; top: 0; width: 18px; height: 18px; border-radius: 50%; background: #030305; border: 3px solid #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.6); z-index: 2; transition: 0.4s; }
.timeline-item:hover .timeline-dot { background: #00f3ff; transform: scale(1.2); }
.timeline-content { padding: 30px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); transition: 0.4s; }
.timeline-item:hover .timeline-content { border-color: var(--border); transform: translateX(10px); }
.timeline-date { display: inline-block; font-size: 0.8rem; font-weight: 600; color: var(--accent-light); letter-spacing: 1px; margin-bottom: 10px; background: rgba(139,92,246,0.1); padding: 4px 12px; border-radius: 100px; }
.timeline-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; margin-bottom: 5px; color: var(--text); }
.timeline-subtitle { font-size: 0.95rem; font-weight: 500; color: #00f3ff; margin-bottom: 15px; display: block; }
.timeline-desc { font-size: 0.95rem; line-height: 1.6; color: va
